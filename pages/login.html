<!DOCTYPE html>
<html lang="fr" class="light-style" dir="ltr" data-theme="theme-default" data-assets-path="../assets/" data-template="vertical-menu-template-free">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion | TactiBoard</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="../assets/img/favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <script>
(function(){
  try {
    var raw = localStorage.getItem('pbm_auth_cache');
    if (!raw) return;
    var data = JSON.parse(raw);
    if (data && data.role) {
      document.documentElement.dataset.userRole = data.role;
      document.documentElement.dataset.roleReady = '1';
    }
  } catch(e) {}
})();
</script>
  <link rel="stylesheet" href="../assets/vendor/fonts/boxicons.css" />
  <link rel="stylesheet" href="../assets/vendor/css/core.css" />
  <link rel="stylesheet" href="../assets/vendor/css/theme-default.css" />
  <link rel="stylesheet" href="../assets/css/demo.css" />
  <link rel="stylesheet" href="../assets/vendor/css/pages/page-auth.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <script src="../assets/vendor/js/helpers.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app/config.local.js"></script>
</head>
<body>
<div class="container-xxl">
  <div class="authentication-wrapper authentication-basic container-p-y">
    <div class="authentication-inner">
      <div class="card">
        <div class="card-body">
          <div class="app-brand justify-content-center mb-3">
            <a href="login.html" class="app-brand-link gap-2">
              <span class="app-brand-logo demo"><img src="../assets/img/branding/logo-horizontal.png" alt="TactiBoard" class="brand-logo-horizontal"></span>
            </a>
          </div>
          <h4 class="mb-2">Connexion & accès</h4>
          <p class="mb-4">Connecte-toi pour accéder au dashboard selon ton rôle.</p>
          <div id="page-alert"></div>
          <div class="d-flex gap-2 mb-4">
            <button type="button" class="btn btn-primary active" data-auth-tab="login">Connexion</button>
            <button type="button" class="btn btn-outline-primary" data-auth-tab="register">Créer un compte</button>
          </div>
          <div id="login-pane">
            <form id="login-form" class="mb-3">
              <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
              <div class="mb-3 form-password-toggle"><label class="form-label">Mot de passe</label><input type="password" class="form-control" name="password" required></div>
              <button class="btn btn-primary d-grid w-100" type="submit">Se connecter</button>
            </form>
          </div>
          <div id="register-pane" class="d-none">
            <form id="register-form" class="mb-3">
              <div class="mb-3"><label class="form-label">Nom complet</label><input type="text" class="form-control" name="full_name" required></div>
              <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
              <div class="mb-3"><label class="form-label">Mot de passe</label><input type="password" class="form-control" name="password" minlength="6" required></div>
              <div class="mb-3"><label class="form-label">Rôle</label><select class="form-select" name="role"><option value="player">Joueuse</option><option value="coach">Coach</option></select></div><div class="mb-3"><label class="form-label" data-i18n="login.team">Équipe</label><select class="form-select" name="team_id" id="register-team-select"><option value="" data-i18n="login.choose_team">Choisir une équipe</option></select></div><div class="small text-muted mb-3" data-i18n="login.pending_info">Après inscription, un admin validera ton accès sous 24h maximum.</div>
              <button class="btn btn-outline-primary d-grid w-100" type="submit">Créer le compte</button>
            </form>
          </div>
          <div class="text-center small text-muted">TactiBoard © 2026</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="../assets/js/app/login.js"></script>
</body>
</html>
